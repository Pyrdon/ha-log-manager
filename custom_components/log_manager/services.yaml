add_logger:
  name: Add Logger
  description: Add a new logger entity.
  fields:
    logger_name:
      name: Logger Name
      description: The Python logger namespace.
      example: homeassistant.components.light
      required: true
      selector:
        text:
    friendly_name:
      name: Friendly Name
      description: A display name for the UI.
      example: Light Component
      required: false
      selector:
        text:

remove_logger:
  name: Remove Logger
  description: Remove an existing logger entity.
  fields:
    logger_name:
      name: Logger Name
      description: The Python logger namespace to remove.
      example: homeassistant.components.light
      required: true
      selector:
        text:

reset_counters:
  name: Reset Counters
  description: Reset warning and error counters for managed loggers.
  fields:
    logger_name:
      name: Logger Name
      description: The Python logger namespace to reset counters for. If omitted, all counters are reset.
      example: homeassistant.components.light
      required: false
      selector:
        text:

set_alert_threshold:
  name: Set Alert Threshold
  description: Notify when a logger logs this many events at or above the chosen severity.
  fields:
    logger_name:
      name: Logger Name
      description: The Python logger namespace to configure.
      example: homeassistant.components.light
      required: true
      selector:
        text:
    events:
      name: Event Threshold
      description: Number of qualifying events that triggers the notification. 0 disables the alert.
      required: true
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    level:
      name: Alert Severity
      description: Only events at or above this severity count toward the threshold.
      required: false
      selector:
        select:
          options:
            - WARNING
            - ERROR
            - CRITICAL

start_recording:
  name: Start Recording
  description: Start capturing log events from the selected managed loggers.
  fields:
    loggers:
      name: Loggers
      description: Managed logger namespaces to capture. Either this or a profile is required.
      example:
        - homeassistant.components.light
      required: false
      selector:
        object:
    profile:
      name: Profile
      description: >-
        A saved profile to run. Overrides loggers; its stored exclusions are
        used as-is, but level overrides from this call still apply.
      required: false
      selector:
        text:
    max_duration:
      name: Max Duration
      description: Session duration limit in seconds (10-3600).
      default: 300
      required: false
      selector:
        number:
          min: 10
          max: 3600
          mode: box
    level_overrides:
      name: Level Overrides
      description: Per-logger capture levels that override each logger's configured level.
      required: false
      selector:
        object:
    excludes:
      name: Excludes
      description: Child paths to exclude, keyed by logger; descendants are included.
      required: false
      selector:
        object:

stop_recording:
  name: Stop Recording
  description: >-
    Stop the active recording session and keep its captured events until they
    are discarded. Fires a log_manager_recording_completed event and returns
    the session summary when called with a response.

discard_recording:
  name: Discard Recording
  description: Discard the active or completed recording session and its captured events.
