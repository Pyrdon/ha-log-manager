add_logger:
  name: Add Logger
  description: Add a new logger entity.
  fields:
    logger_name:
      name: Logger Name
      description: The Python logger namespace.
      example: homeassistant.components.light
      required: true
      selector:
        text:
    friendly_name:
      name: Friendly Name
      description: A display name for the UI.
      example: Light Component
      required: false
      selector:
        text:

remove_logger:
  name: Remove Logger
  description: Remove an existing logger entity.
  fields:
    logger_name:
      name: Logger Name
      description: The Python logger namespace to remove.
      example: homeassistant.components.light
      required: true
      selector:
        text:

reset_counters:
  name: Reset Counters
  description: Reset warning and error counters for managed loggers.
  fields:
    logger_name:
      name: Logger Name
      description: The Python logger namespace to reset counters for. If omitted, all counters are reset.
      example: homeassistant.components.light
      required: false
      selector:
        text:

set_count_level:
  name: Set Count Level
  description: Set the counting threshold for a managed logger.
  fields:
    logger_name:
      name: Logger Name
      description: The Python logger namespace to configure.
      example: homeassistant.components.light
      required: true
      selector:
        text:
    level:
      name: Level
      description: Only events at or above this level are counted and retained.
      required: true
      selector:
        select:
          options:
            - NOTSET
            - DEBUG
            - INFO
            - WARNING
            - ERROR
            - CRITICAL

set_alert_threshold:
  name: Set Alert Threshold
  description: Notify when a managed logger logs at least this many counted events at or above the alert severity.
  fields:
    logger_name:
      name: Logger Name
      description: The Python logger namespace to configure.
      example: homeassistant.components.light
      required: true
      selector:
        text:
    events:
      name: Event Threshold
      description: Number of qualifying counted events that triggers the notification. 0 disables the alert.
      required: true
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    level:
      name: Alert Severity
      description: Only events at or above this severity count toward the threshold.
      required: false
      selector:
        select:
          options:
            - WARNING
            - ERROR
            - CRITICAL
